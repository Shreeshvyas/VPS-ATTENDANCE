name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual run button in GitHub

jobs:
  build-apk:
    name: Compile Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Packages
        run: |
          cd vps_mobile_app
          flutter pub get

      - name: Compile Release APK
        run: |
          cd vps_mobile_app
          flutter build apk --release

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vps-attendance-apk
          path: vps_mobile_app/build/app/outputs/flutter-apk/app-release.apk
