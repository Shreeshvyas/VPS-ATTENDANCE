name: vps_attendance_app
description: "Secure GPS Attendance Application for VPS High School Teachers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for backend communication
  http: ^1.2.1

  # Native GPS device querying
  geolocator: ^11.0.0

  # Hardware UUID fetching for fingerprinting
  device_info_plus: ^10.1.0

  # Local cache for settings and codes
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
